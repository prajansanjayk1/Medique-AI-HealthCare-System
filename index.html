<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    <title>MediQue - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        input {
            font-size: 16px !important;
            transition: all 0.2s ease;
        }
        input:focus {
            transform: translateY(-1px);
        }
        
        button {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Custom scrollbar for aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* === MOBILE-FIRST OPTIMIZATIONS === */
        /* Safe area for notched phones */
        .pt-safe { padding-top: env(safe-area-inset-top, 0); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0); }
        
        /* Touch-friendly sizing */
        button, .btn {
            min-height: 48px;
            min-width: 48px;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (max-width: 768px) {
            /* Full-screen login on mobile */
            .glass-panel {
                margin: 1rem;
                max-width: calc(100vw - 2rem);
                padding: 1.5rem !important;
            }
            
            /* Larger touch targets */
            button, input {
                min-height: 52px;
                font-size: 16px !important;
            }
            
            /* Full-width buttons */
            button {
                width: 100%;
                padding: 14px 20px;
            }
            
            /* Better input spacing */
            input {
                padding: 14px 16px;
                margin-bottom: 0.75rem;
            }
            
            /* Adjust logo sizing */
            .text-5xl { font-size: 2.5rem !important; }
        }
        
        /* Small phone */
        @media (max-width: 375px) {
            .glass-panel {
                margin: 0.5rem;
                padding: 1rem !important;
            }
            
            .text-3xl { font-size: 1.5rem !important; }
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            setPersistence,
            browserLocalPersistence,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            updateProfile,
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithCredential
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- App Configuration ---
        const firebaseConfig = {
          apiKey: "AIzaSyAlLK95wyvpQ-AM4ybrzldy0GIjljL79Kw",
          authDomain: "aishwaryam-acu.firebaseapp.com",
          projectId: "aishwaryam-acu",
          storageBucket: "aishwaryam-acu.firebasestorage.app",
          messagingSenderId: "465782673272",
          appId: "1:465782673272:web:d8daadbe2f6b7308bec28d",
          measurementId: "G-00XFE2VC97"
        };
        const ADMIN_EMAIL = "v.kethari@gmail.com";
        
        // Placeholder for Google Client ID
        const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"; 

        window.onload = async () => {
            // --- PWA Service Worker Registration ---
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('/sw.js');
                    console.log('Service Worker registered successfully');
                } catch (err) {
                    console.error('Service Worker registration failed:', err);
                }
            }

            let auth;

            // --- DOM Elements ---
            const loginView = document.getElementById('login-view');
            const registerView = document.getElementById('register-view');
            const resetView = document.getElementById('reset-view');

            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const resetForm = document.getElementById('reset-form');
            
            const loginEmailInput = document.getElementById('login-email');
            const loginPasswordInput = document.getElementById('login-password');
            
            const registerNameInput = document.getElementById('register-name');
            const registerEmailInput = document.getElementById('register-email');
            const registerPasswordInput = document.getElementById('register-password');

            const resetEmailInput = document.getElementById('reset-email');
            
            const showRegisterBtn = document.getElementById('show-register-btn');
            const showLoginBtn = document.getElementById('show-login-btn');
            const showResetBtn = document.getElementById('show-reset-btn');
            const cancelResetBtn = document.getElementById('cancel-reset-btn');

            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const resetBtn = document.getElementById('reset-btn');

            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            // --- Firebase Init ---
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                await setPersistence(auth, browserLocalPersistence);
                
                // --- Initialize Google One Tap ---
                if (window.google && GOOGLE_CLIENT_ID.includes("YOUR_")) {
                    console.warn("Google Client ID is missing. One Tap will not load.");
                } else if (window.google) {
                    google.accounts.id.initialize({
                        client_id: GOOGLE_CLIENT_ID,
                        callback: handleCredentialResponse,
                        auto_select: false,
                        cancel_on_tap_outside: false
                    });
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                            console.log("One Tap skipped/not displayed:", notification.getNotDisplayedReason());
                        }
                    });
                }

            } catch (error) {
                console.error("Firebase Init Error:", error);
                showError("Error initializing app. Please refresh.");
                return;
            }
            
            // Handle Google One Tap Response via Firebase
            async function handleCredentialResponse(response) {
                try {
                    const credential = GoogleAuthProvider.credential(response.credential);
                    await signInWithCredential(auth, credential);
                    // onAuthStateChanged will handle redirect
                } catch (error) {
                    console.error("Google Sign-In Error:", error);
                    showError("Google Sign-In failed: " + error.message);
                }
            }


            // --- Auth Guard ---
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // User is signed in
                    if (user.email === ADMIN_EMAIL) {
                        window.location.href = 'doctor.html';
                    } else {
                        window.location.href = 'patient.html';
                    }
                }
                // If user is null, just stay on the login page
            });

            // --- View Switching ---
            showRegisterBtn.addEventListener('click', () => {
                loginView.style.display = 'none';
                resetView.style.display = 'none';
                registerView.style.display = 'block';
                hideMessages();
            });

            showLoginBtn.addEventListener('click', () => {
                registerView.style.display = 'none';
                resetView.style.display = 'none';
                loginView.style.display = 'block';
                hideMessages();
            });

            showResetBtn.addEventListener('click', () => {
                loginView.style.display = 'none';
                registerView.style.display = 'none';
                resetView.style.display = 'block';
                resetEmailInput.value = loginEmailInput.value; // Pre-fill email
                hideMessages();
            });

            cancelResetBtn.addEventListener('click', () => {
                resetView.style.display = 'none';
                loginView.style.display = 'block';
                hideMessages();
            });

            // --- Helper Functions ---
            function showError(message) {
                successMsg.style.display = 'none';
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
            }

            function showSuccess(message) {
                errorMsg.style.display = 'none';
                successMsg.textContent = message;
                successMsg.style.display = 'block';
            }

            function hideMessages() {
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
            }

            function setLoading(button, isLoading) {
                if (isLoading) {
                    button.disabled = true;
                    button.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-white mx-auto"></div>';
                } else {
                    button.disabled = false;
                    // Reset button text based on ID
                    if (button.id === 'login-btn') button.textContent = 'Sign In';
                    if (button.id === 'register-btn') button.textContent = 'Create Account';
                    if (button.id === 'reset-btn') button.textContent = 'Send Reset Link';
                }
            }

            // --- Auth Logic ---

            // Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessages();
                setLoading(loginBtn, true);

                const email = loginEmailInput.value;
                const password = loginPasswordInput.value;

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // onAuthStateChanged will handle the redirect
                } catch (error) {
                    console.error("Login Error:", error);
                    showError(error.message);
                }
                setLoading(loginBtn, false);
            });

            // Register
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessages();
                setLoading(registerBtn, true);

                const name = registerNameInput.value.trim();
                const email = registerEmailInput.value;
                const password = registerPasswordInput.value;

                if (name.length < 2) {
                    showError("Please enter your full name.");
                    setLoading(registerBtn, false);
                    return;
                }

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    // Now update the user's profile
                    await updateProfile(userCredential.user, {
                        displayName: name
                    });
                    // onAuthStateChanged will handle the redirect
                } catch (error) {
                    console.error("Register Error:", error);
                    showError(error.message);
                }
                setLoading(registerBtn, false);
            });

            // --- Forgot Password Logic ---
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessages();
                setLoading(resetBtn, true);

                const email = resetEmailInput.value;

                try {
                    await sendPasswordResetEmail(auth, email);
                    showSuccess("Password reset link sent! Please check your email inbox.");
                } catch (error) {
                    console.error("Reset Password Error:", error);
                    showError(error.message);
                }
                setLoading(resetBtn, false);
            });
        };
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-[420px] relative z-10">
        <!-- Logo and Title -->
        <div class="flex flex-col items-center mb-8 animate-fade-in">
            <div class="bg-white p-3 rounded-2xl shadow-lg mb-4">
                <img class="h-12 w-auto" src="/logo.png" alt="MediQue Logo" onerror="this.src='https://placehold.co/100x100/4f46e5/FFFFFF?text=MQ'">
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">MediQue</h1>
            <p class="text-blue-100 mt-2 text-center text-sm font-medium opacity-90">Smart Queue Management System</p>
        </div>

        <!-- Success/Error Messages -->
        <div id="error-msg" class="hidden p-4 mb-6 text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl shadow-sm animate-fade-in" role="alert">
            Error message goes here.
        </div>
        <div id="success-msg" class="hidden p-4 mb-6 text-sm text-emerald-600 bg-emerald-50 border border-emerald-100 rounded-xl shadow-sm animate-fade-in" role="alert">
            Success message goes here.
        </div>

        <!-- Login View -->
        <div id="login-view" class="glass-panel p-8 rounded-3xl shadow-2xl animate-fade-in">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
                <p class="text-gray-500 text-sm mt-1">Please sign in to continue</p>
            </div>
            
            <form id="login-form" class="space-y-5">
                <div class="space-y-1">
                    <label for="login-email" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Email</label>
                    <input type="email" id="login-email" class="block w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white" placeholder="you@example.com" required>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between items-center ml-1">
                        <label for="login-password" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Password</label>
                        <button type="button" id="show-reset-btn" class="text-xs font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Forgot Password?</button>
                    </div>
                    <input type="password" id="login-password" class="block w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white" placeholder="••••••••" required>
                </div>
                
                <button id="login-btn" type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/30 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                    Sign In
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-500">
                    New to MediQue?
                    <button id="show-register-btn" class="font-semibold text-indigo-600 hover:text-indigo-500 ml-1 transition-colors">
                        Create Account
                    </button>
                </p>
            </div>
        </div>

        <!-- Register View -->
        <div id="register-view" class="glass-panel p-8 rounded-3xl shadow-2xl animate-fade-in" style="display: none;">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
                <p class="text-gray-500 text-sm mt-1">Join MediQue for a better experience</p>
            </div>

            <form id="register-form" class="space-y-5">
                <div class="space-y-1">
                    <label for="register-name" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Full Name</label>
                    <input type="text" id="register-name" class="block w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white" placeholder="John Doe" required>
                </div>
                <div class="space-y-1">
                    <label for="register-email" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Email</label>
                    <input type="email" id="register-email" class="block w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white" placeholder="you@example.com" required>
                </div>
                <div class="space-y-1">
                    <label for="register-password" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Password</label>
                    <input type="password" id="register-password" class="block w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white" placeholder="••••••••" required>
                </div>
                
                <button id="register-btn" type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/30 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                    Create Account
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-500">
                    Already have an account?
                    <button id="show-login-btn" class="font-semibold text-indigo-600 hover:text-indigo-500 ml-1 transition-colors">
                        Sign In
                    </button>
                </p>
            </div>
        </div>

        <!-- Reset Password View -->
        <div id="reset-view" class="glass-panel p-8 rounded-3xl shadow-2xl animate-fade-in" style="display: none;">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Reset Password</h2>
                <p class="text-gray-500 text-sm mt-1">We'll send you a link to reset it</p>
            </div>
            
            <form id="reset-form" class="space-y-5">
                <div class="space-y-1">
                    <label for="reset-email" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Email</label>
                    <input type="email" id="reset-email" class="block w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white" placeholder="you@example.com" required>
                </div>
                
                <button id="reset-btn" type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/30 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                    Send Reset Link
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <button id="cancel-reset-btn" class="text-sm font-semibold text-gray-500 hover:text-gray-700 transition-colors flex items-center justify-center mx-auto">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Login
                </button>
            </div>
        </div>

    </div>

</body>
</html>
